[package]
name = "storyscript-bundle"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-only"
description = "Deterministic signed StoryScript bundle compiler and loader"
build = "build.rs"

[lib]
name = "storyscript_bundle"

[[bin]]
name = "storyscript-bundle"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8", "rand_core", "zeroize"] }
globset = "0.4.16"
hex = "0.4.3"
prost = "=0.14.1"
rust_decimal = "1.41.0"
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
toml = "0.9.5"
unicode-normalization = "0.1.24"
walkdir = "2.5.0"
zeroize = "1.8.1"
zip = { version = "4.6.1", default-features = false }
storyscript-parser = { path = "../../parser/rust" }

[dev-dependencies]
pkcs8 = { version = "0.10.2", features = ["pem"] }
prost-types = "=0.14.1"
rand = "0.8.5"
tempfile = "3.22.0"

[build-dependencies]
prost-build = "=0.14.1"
protoc-bin-vendored = "=3.2.0"
