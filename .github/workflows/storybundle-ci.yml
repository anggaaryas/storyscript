name: StoryBundle CI

on:
  push:
    paths:
      - 'parser/rust/**'
      - 'bundle/**'
      - 'player/**'
      - 'storyscript_player_core/**'
      - 'storyscript_bundle/**'
      - 'docs/**'
      - 'tool/vscode-storyscript/**'
      - 'tests/localization_gates.py'
      - 'deny.toml'
      - '.github/workflows/storybundle-ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'parser/rust/**'
      - 'bundle/**'
      - 'player/**'
      - 'storyscript_player_core/**'
      - 'storyscript_bundle/**'
      - 'docs/**'
      - 'tool/vscode-storyscript/**'
      - 'tests/localization_gates.py'
      - 'deny.toml'
      - '.github/workflows/storybundle-ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      run_ui_platform:
        description: Human-owned widget and platform acceptance (tests require human maintenance)
        required: true
        default: false
        type: boolean
      run_web_wasm:
        description: Run the slow WebAssembly browser integration test
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: storybundle-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FLUTTER_RUST_BRIDGE_VERSION: 2.13.0
  SOURCE_FLUTTER_RUST_BRIDGE_VERSION: 2.12.0
  PROTOC_PLUGIN_VERSION: 25.1.0
  WASM_BINDGEN_VERSION: 0.2.118

jobs:
  editor-localization:
    name: Workspace localization editor owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/vscode-storyscript/package-lock.json
      - run: npm --prefix tool/vscode-storyscript ci
      - run: npm --prefix tool/vscode-storyscript test
      - run: npm --prefix tool/vscode-storyscript run compile
      - run: npm --prefix tool/vscode-storyscript run package
      - run: npm --prefix tool/vscode-storyscript audit
      - run: git diff --exit-code -- tool/vscode-storyscript/package-lock.json
  shared-player-runtime:
    name: Shared player runtime and save owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path player/Cargo.toml --no-default-features --features storybundle-runtime
      - run: cargo test --manifest-path player/Cargo.toml --test cli_help
      - run: cargo test --manifest-path storyscript_player_core/rust/Cargo.toml
      - run: test -f player/proto/storyplayer/v1/schema.sha256

  parser-safety:
    name: Parser safety owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path parser/rust/Cargo.toml -- --check
      - run: cargo test --manifest-path parser/rust/Cargo.toml
      - run: cargo check --manifest-path player/Cargo.toml --no-default-features

  rust-bundle:
    name: Rust format and security owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo fmt --manifest-path bundle/rust/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bundle/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path bundle/rust/Cargo.toml
      - run: cargo run --manifest-path bundle/rust/Cargo.toml -- schema check
      - run: cargo run --manifest-path bundle/rust/Cargo.toml -- localize check --project storyscript_bundle/example/game --json
      - run: cargo run --manifest-path bundle/rust/Cargo.toml -- localize check --project tool/vscode-storyscript/server/test/fixtures/localized --json
      - run: cargo check --manifest-path bundle/rust/fuzz/Cargo.toml
      - run: cargo test --manifest-path storyscript_bundle/rust/Cargo.toml
      - run: cargo check --manifest-path storyscript_player_core/rust/Cargo.toml
      - run: cargo audit --file bundle/rust/Cargo.lock
      - run: cargo audit --file player/Cargo.lock
      - run: cargo audit --file storyscript_player_core/rust/Cargo.lock
      - run: cargo audit --file storyscript_bundle/rust/Cargo.lock
      - run: cargo audit --file bundle/rust/fuzz/Cargo.lock
      - run: cargo deny --manifest-path bundle/rust/Cargo.toml check
      - run: python3 tests/localization_gates.py

  generated-contracts:
    name: Generated contract owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: dart pub global activate protoc_plugin "$PROTOC_PLUGIN_VERSION"
      - run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --locked
      - run: cargo install flutter_rust_bridge_codegen --version "$SOURCE_FLUTTER_RUST_BRIDGE_VERSION" --locked --root "$RUNNER_TEMP/frb212"
      - run: flutter pub get
        working-directory: storyscript_bundle
      - run: >-
          protoc --proto_path=bundle/proto
          --dart_out=storyscript_bundle/lib/src/proto
          bundle/proto/storybundle/v1/compiled_story.proto
      - run: flutter_rust_bridge_codegen generate
        working-directory: storyscript_bundle
      - run: flutter pub get
        working-directory: storyscript_player_core
      - run: '"$RUNNER_TEMP/frb212/bin/flutter_rust_bridge_codegen" generate'
        working-directory: storyscript_player_core
      - run: cargo run --manifest-path bundle/rust/Cargo.toml -- schema check
      - run: cargo test --manifest-path player/Cargo.toml --no-default-features --test save_contract
      - run: flutter pub get
        working-directory: storyscript_bundle/example
      - run: flutter gen-l10n
        working-directory: storyscript_bundle/example
      - run: >-
          git diff --exit-code --
          bundle/proto/storybundle/v1
          player/proto/storyplayer/v1
          storyscript_bundle/example/lib/l10n
          storyscript_bundle/lib/src/proto
          storyscript_bundle/lib/src/rust
          storyscript_bundle/rust/src/frb_generated.rs
          storyscript_player_core/lib/src/rust
          storyscript_player_core/rust/src/frb_generated.rs

  flutter-tests:
    name: Flutter analysis and non-UI facade owner (UI acceptance opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: storyscript_bundle
      - name: Resolve vendored Cargokit dependencies
        run: dart pub get
        working-directory: storyscript_bundle/cargokit/build_tool
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: storyscript_bundle
      - run: flutter analyze
        working-directory: storyscript_bundle
      - run: flutter test test/protobuf_contract_test.dart test/story_bundle_loader_test.dart test/player_api_test.dart test/player_progression_test.dart test/player_save_test.dart test/player_lifecycle_test.dart test/bridge_contract_test.dart test/trust_policy_test.dart test/asset_access_test.dart test/web_build_destination_test.dart
        working-directory: storyscript_bundle
      - run: flutter pub get
        working-directory: storyscript_player_core
      - name: Resolve vendored Cargokit dependencies
        run: dart pub get
        working-directory: storyscript_player_core/cargokit/build_tool
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: storyscript_player_core
      - run: flutter analyze
        working-directory: storyscript_player_core
      - run: flutter test test/player_save_contract_test.dart
        working-directory: storyscript_player_core
      - run: flutter pub get
        working-directory: storyscript_bundle/example
      - run: flutter gen-l10n
        working-directory: storyscript_bundle/example
      - run: dart format --output=none --set-exit-if-changed lib test/game_controller_locale_test.dart
        working-directory: storyscript_bundle/example
      - run: flutter analyze
        working-directory: storyscript_bundle/example
      - run: flutter test test/game_controller_locale_test.dart
        working-directory: storyscript_bundle/example
      - name: Human-owned example UI formatting acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.run_ui_platform
        run: dart format --output=none --set-exit-if-changed test integration_test
        working-directory: storyscript_bundle/example
      - name: Human-owned example widget acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.run_ui_platform
        run: flutter test test
        working-directory: storyscript_bundle/example

  web-wasm:
    name: Web Wasm and COOP/COEP owner
    if: github.event_name == 'workflow_dispatch' && inputs.run_web_wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: nanasess/setup-chromedriver@v2
      - run: cargo install flutter_rust_bridge_codegen --version "$FLUTTER_RUST_BRIDGE_VERSION" --locked
      - run: >-
          flutter_rust_bridge_codegen build-web
          --output ../example/web
        working-directory: storyscript_bundle
      - run: test -s example/web/pkg/storyscript_bundle_bg.wasm
        working-directory: storyscript_bundle
      - run: flutter build web
        working-directory: storyscript_bundle/example
      - name: Run bounded browser integration test
        shell: bash
        run: |
          set -euo pipefail

          chromedriver --port=4444 >"$RUNNER_TEMP/chromedriver.log" 2>&1 &
          chromedriver_pid=$!
          trap 'kill "$chromedriver_pid" 2>/dev/null || true' EXIT

          chromedriver_ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4444/status >/dev/null; then
              chromedriver_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$chromedriver_ready" != "true" ]]; then
            cat "$RUNNER_TEMP/chromedriver.log"
            echo "ChromeDriver did not become ready within 30 seconds." >&2
            exit 1
          fi

          set +e
          timeout --signal=TERM 15m flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/storybundle_loading_test.dart \
            -d chrome \
            --web-header=Cross-Origin-Opener-Policy=same-origin \
            --web-header=Cross-Origin-Embedder-Policy=require-corp
          test_status=$?
          set -e

          if [[ $test_status -ne 0 ]]; then
            cat "$RUNNER_TEMP/chromedriver.log"
            exit "$test_status"
          fi
        working-directory: storyscript_bundle/example

  platform-builds:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_platform
    name: ${{ matrix.name }} package build owner
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            command: flutter build apk --debug
          - name: Linux
            os: ubuntu-latest
            command: flutter build linux --debug
          - name: iOS simulator
            os: macos-latest
            command: flutter build ios --simulator --no-codesign
          - name: macOS
            os: macos-latest
            command: flutter build macos --debug
          - name: Windows
            os: windows-latest
            command: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: ${{ matrix.command }}
        working-directory: storyscript_bundle/example

  docs-and-secrets:
    name: Secret-scan owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
