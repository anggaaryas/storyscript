[package]
name = "storyscript_bundle"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-only"
description = "Flutter Rust Bridge wrapper for verified StoryScript bundles"
repository = "https://github.com/anggaaryas/storyscript"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ed25519-dalek = "2.2.0"
flutter_rust_bridge = "=2.13.0"
prost = "=0.14.1"
storyscript_bundle_core = { package = "storyscript-bundle", path = "../../bundle/rust" }
storyscript-player = { path = "../../player", default-features = false, features = ["storybundle-runtime"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.118"

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
pkcs8 = { version = "0.10.2", features = ["pem"] }
rand = "0.8.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
